<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>イントロかるた</title>
<style>
:root{--bg:#faf6ee;--fg:#2b2622;--card:#fff;--line:#d9cfbf;--acc:#e8742a;--ok:#2f8f5b;--ng:#b3261e;--mut:#7a7066}
:root[data-mode="shiny"]{--acc:#3b8fb5}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--fg:#f1ebe2;--card:#2a2622;--line:#4a423a;--ok:#5fcf93;--ng:#ff8a80;--mut:#a89d90}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 10px}
.row{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px;min-width:0}
.tab,.main{padding:10px 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:15px;font-weight:700;cursor:pointer}
.tab{flex:1}.tab.on,.main{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;justify-content:space-between;margin-bottom:8px;font-size:15px}
.players{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:14px}
.players span{padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.status{min-height:44px;padding:10px;border:1px dashed var(--line);border-radius:10px;text-align:center;margin-bottom:10px;font-size:15px}
.info{display:none;border:2px solid var(--acc);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--card);font-size:14px}
.info h3{margin:0 0 6px;font-size:16px;color:var(--acc)}.info p{margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{height:92px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;padding:0;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover}
.card:active{transform:scale(.95)}
.card.you{border-color:var(--ok);opacity:.35;pointer-events:none;outline:3px solid var(--ok)}
.card.other{border-color:var(--ng);opacity:.35;pointer-events:none;outline:3px solid var(--ng)}
.card.bad{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.center{text-align:center;margin:14px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>🎴 イントロかるた</h1>
<section id="home">
 <div class="row"><input id="name" placeholder="ニックネーム" maxlength="10"></div>
 <div class="row"><button class="tab on" data-m="gakumas">学マスモード</button><button class="tab" data-m="shiny">シャニマスモード</button></div>
 <div class="row"><button class="main" id="create" style="flex:1">部屋を作る</button></div>
 <div class="row"><input id="code" placeholder="4桁の合言葉" inputmode="numeric" maxlength="4"><button class="main" id="join">参加</button></div>
</section>
<section id="room" hidden>
 <div class="bar"><div id="roomcode"></div><div id="left"></div></div>
 <div class="players" id="players"></div>
 <div class="status" id="st"></div>
 <div class="info" id="info"></div>
 <div class="grid" id="grid"></div>
 <div class="center"><button class="main" id="start" hidden>スタート</button></div>
</section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase,ref,set,get,update,onValue,runTransaction} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

// ===== 設定（ここを書き換える） =====
const FIREBASE_CONFIG={apiKey:"AIzaSyANLI7PRkZNjRwTZmfAUbbpNzMpczFWgD4",authDomain:"intro-karuta.firebaseapp.com",databaseURL:"https://intro-karuta-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"intro-karuta",appId:"1:366436776020:web:9bbe7b686e906c4055d5c1"};
const SOURCES={gakumas:"",shiny:""}; // 各タブの「ウェブに公開」CSVのURL
const AUDIO_DIR="audio/";
const LABELS={unit:"ユニット"};
const COMMON=["ID","image","title","explain","music"];
// ====================================

const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let uid,offset=0,mode="gakumas",code,room,songs=[],deckData=[],lastRound=-2,doneRound=-2,ctx,timer,audio,locked=false;
onValue(ref(db,".info/serverTimeOffset"),s=>offset=s.val()||0);
const now=()=>Date.now()+offset;
const ready=signInAnonymously(auth).then(c=>{uid=c.user.uid});

function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}
if(c||r.length){r.push(c);rows.push(r)}
const h=rows.shift().map(x=>x.trim());return rows.filter(x=>x.join("")).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}
async function loadSongs(m){if(!SOURCES[m]){alert("SOURCES にCSVのURLを設定してください");return[]}
try{return parseCSV(await (await fetch(SOURCES[m])).text())}catch(e){alert("曲リストを読み込めませんでした");return[]}}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function unlock(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}
function setMode(m){mode=m;document.documentElement.dataset.mode=m==="shiny"?"shiny":""}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));setMode(b.dataset.m)});
const nm=()=>($("name").value.trim()||"ゲスト").slice(0,10);

$("create").onclick=async()=>{unlock();await ready;songs=await loadSongs(mode);if(songs.length<2)return;
code=String(Math.floor(1000+Math.random()*9000));
await set(ref(db,"rooms/"+code),{mode,host:uid,state:"lobby",round:-1,startAt:0,deck:shuffle(songs.map(s=>s.ID)).slice(0,12),players:{[uid]:{name:nm()}}});enter()};
$("join").onclick=async()=>{unlock();await ready;code=$("code").value.trim();const s=await get(ref(db,"rooms/"+code));
if(!s.exists())return alert("部屋が見つかりません");setMode(s.val().mode);songs=await loadSongs(mode);if(!songs.length)return;
await set(ref(db,`rooms/${code}/players/${uid}`),{name:nm()});enter()};
function enter(){$("home").hidden=true;$("room").hidden=false;onValue(ref(db,"rooms/"+code),s=>{room=s.val();if(room)sync()})}
$("start").onclick=()=>update(ref(db,"rooms/"+code),{state:"playing",round:0,startAt:now()+3000});

function sync(){setMode(room.mode);deckData=(room.deck||[]).map(id=>songs.find(s=>s.ID===id)||{ID:id,title:id});render();
const r=room.round,w=(room.win||{})[r];
if(room.state==="playing"&&r!==lastRound){lastRound=r;startRound(r)}
if(room.state==="playing"&&w&&doneRound!==r){doneRound=r;stop();showInfo(deckData[r]);
$("st").textContent=w.uid===uid?"✅ あなたが取った！":"💨 "+(room.players[w.uid]?.name||"誰か")+" が取った";
if(room.host===uid)setTimeout(advance,3500)}
if(room.state==="lobby")$("st").textContent="参加者を待っています。合言葉を友達に伝えてください";
if(room.state==="ended"){stop();$("st").textContent="🏁 終了！ 結果は上のスコアを見てね"}}
function advance(){const r=room.round+1;update(ref(db,"rooms/"+code),r>=room.deck.length?{state:"ended"}:{round:r,startAt:now()+3000})}

function src(c){const f=c.music||(c.ID?c.ID+".mp3":"");return f?(/^https?:/.test(f)?f:AUDIO_DIR+f):""}
function startRound(r){stop();locked=false;$("info").style.display="none";$("st").textContent="まもなく開始…";
const c=deckData[r];audio=src(c)?new Audio(src(c)):null;if(audio){audio.loop=true;audio.preload="auto"}
setTimeout(()=>{if(room.round!==r||(room.win||{})[r])return;$("st").textContent="🎵 この曲はどれ？";
if(audio)audio.play().catch(()=>{audio=null;synth(c)});else synth(c)},Math.max(0,room.startAt-now()))}
function stop(){clearTimeout(timer);if(audio){audio.pause();audio=null}}
function hash(s){let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))%2147483647;return h||1}
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function synth(c){const seed=hash(String(c.ID)),r=rng(seed),deg=[0,2,4,7,9,12,14],durs=[.16,.16,.32,.24],wave=["triangle","square","sawtooth","sine"][seed%4];
const notes=Array.from({length:10},()=>({f:261.63*Math.pow(2,deg[Math.floor(r()*7)]/12),d:durs[Math.floor(r()*4)]}));let i=0;
const step=()=>{const n=notes[i++%10],o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type=wave;o.frequency.value=n.f;
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+n.d);
o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+n.d+.02);timer=setTimeout(step,n.d*1000)};step()}

async function tap(c){const r=room.round;if(room.state!=="playing"||locked||now()<room.startAt||(room.win||{})[r])return;
if(c.ID!==room.deck[r]){locked=true;$("st").textContent="❌ お手つき！2秒休み";setTimeout(()=>{locked=false},2000);return}
await runTransaction(ref(db,`rooms/${code}/win/${r}`),cur=>cur===null?{uid,t:now()}:undefined)}

function render(){const win=room.win||{},deck=room.deck||[],owner={},score={};
Object.keys(win).forEach(r=>{owner[deck[r]]=win[r].uid;score[win[r].uid]=(score[win[r].uid]||0)+1});
$("roomcode").textContent="合言葉 "+code;$("left").textContent="残り "+(deck.length-Object.keys(win).length)+" 枚";
const p=$("players");p.innerHTML="";Object.entries(room.players||{}).sort((a,b)=>(score[b[0]]||0)-(score[a[0]]||0)).forEach(([id,v])=>{
const s=document.createElement("span");s.textContent=(id===room.host?"👑 ":"")+v.name+" "+(score[id]||0)+(id===uid?"（あなた）":"");p.appendChild(s)});
const g=$("grid");g.innerHTML="";deckData.forEach(c=>{const b=document.createElement("button");b.className="card"+(owner[c.ID]?(owner[c.ID]===uid?" you":" other"):"");
if(c.image){const im=document.createElement("img");im.src=c.image;im.alt=c.title;b.appendChild(im)}else b.textContent=c.title;
b.onclick=()=>{tap(c);if(locked)b.classList.add("bad")};g.appendChild(b)});
$("start").hidden=!(room.host===uid&&room.state==="lobby")}
function showInfo(c){const k=Object.keys(c).filter(x=>!COMMON.includes(x)&&c[x]);
$("info").innerHTML=(c.image?`<img src="${esc(c.image)}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px;float:right;margin-left:10px">`:"")+
`<h3>${esc(c.title)}</h3>`+k.map(x=>`<div>${esc(LABELS[x]||x)}：${esc(c[x])}</div>`).join("")+(c.explain?`<p>${esc(c.explain)}</p>`:"");$("info").style.display="block"}
</script>
</body>
</html>
